[workspace]
resolver = "2"
members = [
    "crates/pet-core",
    "crates/pet-audio",
    "crates/pet-render",
    "crates/pet-ui",
    "crates/pet-app",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
pet-core = { path = "crates/pet-core" }
pet-audio = { path = "crates/pet-audio" }
pet-render = { path = "crates/pet-render" }
pet-ui = { path = "crates/pet-ui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp"] }
tiny-skia = "0.11"
egui = { version = "0.31", default-features = false, features = ["default_fonts"] }
wasapi = "0.17"
rustfft = "6"
ringbuf = "0.4"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "flac", "ogg", "vorbis", "aac", "isomp4", "pcm"] }
tray-icon = "0.21"
global-hotkey = "0.7"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
