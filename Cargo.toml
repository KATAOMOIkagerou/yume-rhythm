[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
# 内部 crate（依赖方向见 docs/架构.md 第 2 节，由 xtask 检查）
yume-core = { path = "crates/core" }
yume-beat = { path = "crates/beat" }
yume-character = { path = "crates/character" }
yume-win = { path = "crates/win" }
yume-audio = { path = "crates/audio" }
yume-console = { path = "crates/console" }

# 第三方
anyhow = "1"
cpal = "0.18"
global-hotkey = "0.10"
log = "0.4"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# raw-window-handle-06：取控制台的原生窗口句柄，用来把它带到最前面。
slint = { version = "1.19", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"
slint-build = "1.19"
symphonia = { version = "0.6", default-features = false }
thiserror = "2"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
tray-icon = "0.26"
windows = "0.62"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# 开发构建：只保留行号信息，依赖不带调试信息（Slint 的调试符号很大）。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.build-override]
debug = false
