[package]
name = "desktop-pet-rust"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "桌宠节奏师：Rust 与 WebView2 独立桌面版"
license = "MIT"

[dependencies]
wry = { version = "=0.53.5", features = ["transparent", "devtools"] }
tao = "=0.34.5"
tray-icon = "0.21"
global-hotkey = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"
mime_guess = "2"
percent-encoding = "2"
base64 = "0.22"
wasapi = "=0.17.0"
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.60", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
